# nginx.conf — Local development reverse proxy for dev.gomoku.games
# Serves static assets directly, proxies API routes to FastAPI (:8000).
# FastAPI handles /game/play proxy to gomoku-httpd via envoy internally.

user kig staff;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 256;
  multi_accept on;
  use kqueue;
}

http {
  include /opt/homebrew/etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" '
    'rt=$request_time urt="$upstream_response_time"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript
    application/xml application/xml+rss text/javascript image/svg+xml;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

  # Per-site server blocks — one file per site (dev.gomoku.games, etc.)
  include /opt/homebrew/etc/nginx/sites-enabled/*;
}
